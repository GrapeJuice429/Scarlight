# AI review of pull requests to this fork (OpenRabbit, Apache-2.0, aryanbrite/openrabbit).
# Pinned to v0.9.1 by commit. Needs the repository secret LLM_API_KEY (an OpenRouter key).
name: OpenRabbit review
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: ${{ github.repository == 'pablogonz12/VIctory' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aryanbrite/openrabbit@4534913d4062eaedb8da178d3123b7b5c2e4dab4 # v0.9.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_provider: openrouter
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
